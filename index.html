<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大会受付</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--card:#fff;--line:#dde1e8;--ok:#1a8f4c;--ng:#c9372c;--acc:#2456d6;--mute:#6b7487}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#e8ebf1;--card:#1d222b;--line:#323a47;--ok:#47c27a;--ng:#ff6b5e;--acc:#7ca0ff;--mute:#98a2b5}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:18px;margin:0 8px 0 0}
input,button,select{font:inherit;color:inherit}
input[type=text],input[type=password],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#search{flex:1;min-width:160px;max-width:360px}
.who{color:var(--mute);font-size:14px}
.stat{color:var(--mute);font-size:14px;margin-left:auto}
main{padding:12px 16px;max-width:980px;margin:0 auto}
.row{display:grid;grid-template-columns:minmax(64px,.5fr) minmax(120px,1.2fr) minmax(140px,1.2fr) auto minmax(80px,.8fr) auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.name{font-weight:600;word-break:break-all}
.paid{min-width:84px;font-weight:600}
.paid.y{background:var(--ok);border-color:var(--ok);color:#fff}
.paid.n{color:var(--ng);border-color:var(--ng)}
.call .row{grid-template-columns:1fr auto;padding:14px 16px}
.yomi-big{font-size:28px;font-weight:700}
.name-small{color:var(--mute);font-size:15px}
.badge{text-align:center;padding:7px 12px;border:1px solid;border-radius:8px;font-weight:600}
.badge.y{color:var(--ok)}.badge.n{color:var(--ng)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);width:min(560px,92vw)}
textarea{min-height:200px}
#gate{max-width:360px;margin:16vh auto;padding:0 16px}
#gate input{margin-bottom:8px}
.err{color:var(--ng);min-height:1.4em;white-space:pre-wrap}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.srow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow span{flex:1}
.form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:12px}
.notice{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--mute);margin-bottom:10px}
body.v-bracket .pOnly{display:none!important}
.mute{color:var(--mute)}
.match{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.match.done{opacity:.8}
.mhead{display:flex;gap:8px;align-items:baseline;margin-bottom:8px;color:var(--mute);font-size:14px}
.mhead b{color:var(--fg);font-size:16px}
.sides{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.side{min-width:0;word-break:break-all}
.side.win{outline:2px solid var(--ok);outline-offset:4px;border-radius:6px}
.vs{color:var(--mute);font-weight:700}
.wbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.wbtns button{padding:10px 8px;font-weight:600}
.sec{margin:18px 0 8px;font-size:15px;color:var(--mute)}
details.waiting{margin-top:14px}
details.waiting summary{cursor:pointer;color:var(--mute)}
.chart-wrap{overflow:auto;max-height:calc(100vh - 150px);border:1px solid var(--line);border-radius:10px;background:var(--card)}
.chart{position:relative}
.chart svg{position:absolute;left:0;top:0;pointer-events:none}
.chart svg path{fill:none;stroke:var(--mute);stroke-width:1;opacity:.45}
.chbar{position:sticky;top:0;z-index:3;height:30px;background:var(--card);border-bottom:1px solid var(--line)}
.chd{position:absolute;top:3px;font-size:12px;font-weight:700;color:var(--fg);text-align:center;background:color-mix(in srgb,var(--acc) 16%,var(--card));border-radius:6px;padding:2px 0}
.chbar.l .chd{background:color-mix(in srgb,#d98a00 22%,var(--card))}
.cc{position:absolute;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font-size:12px;line-height:1.35;overflow:hidden}
.cc:hover{border-color:var(--acc)}
.cc .ch{font-size:10px;color:var(--mute);padding:0 6px;background:var(--card);border-bottom:1px solid var(--line)}
.cc .cr{display:flex;justify-content:space-between;gap:4px;padding:0 6px;height:18px;align-items:center}
.cc .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .cn i{color:var(--mute);font-style:normal;font-size:11px}
.cc .cs{font-weight:700;min-width:12px;text-align:right}
.cc .cr.w{background:color-mix(in srgb,var(--ok) 22%,transparent);font-weight:700}
.cc.ready{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.cc.live{border-color:#d98a00;box-shadow:0 0 0 1px #d98a00}
.cc.done{opacity:.8}
.cc.dim{opacity:.22}
.mini{font-size:14px;padding:4px 10px}
.games{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:15px}
.games .winline{margin-top:4px;font-weight:700;color:var(--ok)}
.regby{margin-top:2px;font-size:13px}
.mlog{margin-top:12px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;max-height:180px;overflow:auto}
.logrow{padding:2px 0}
.subbtns{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
details>summary.mini{cursor:pointer;display:inline-block;color:var(--mute);padding:4px 0}
.brbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.brbar select{width:auto}
@media (max-width:640px){.sides{grid-template-columns:1fr}.vs{text-align:center}.row{grid-template-columns:1fr 1fr}.row .note{grid-column:1/-1}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="gate" hidden>
  <h1>大会受付</h1>
  <p>名前とパスワードを入力してください。</p>
  <input id="uname" type="text" placeholder="名前" autocomplete="username">
  <input id="pass" type="password" placeholder="パスワード" autocomplete="current-password">
  <p class="err" id="gateErr"></p>
  <button class="primary" id="enter">ログイン</button>
</div>

<div id="app" hidden>
<header>
  <h1>大会受付</h1>
  <button id="tabPlayers" class="on">参加者</button>
  <button id="tabBracket">対戦表</button>
  <input id="search" type="text" placeholder="名前・読み・登録番号で検索">
  <span data-need="edit" class="pOnly">
    <button data-f="all" class="on">全員</button>
    <button data-f="unpaid">未払い</button>
    <button data-f="noyomi">読み未入力</button>
  </span>
  <select id="sortSel" class="pOnly" title="並び順" style="width:auto">
    <option value="no">番号順</option>
    <option value="yomi">読み順</option>
    <option value="id">取り込み順</option>
  </select>
  <button id="modeBtn" data-need="edit" class="pOnly">呼び出し表示</button>
  <button id="importBtn" data-need="admin" class="pOnly">名前を取り込む</button>
  <button id="staffBtn" data-need="admin">アカウント</button>
  <span class="stat" id="stat"></span>
  <span class="who" id="who"></span>
  <button id="logout">ログアウト</button>
</header>
<main>
  <div id="list"></div>
</main>
</div>

<dialog id="mdlg">
  <div id="mbody"></div>
  <div style="text-align:right;margin-top:8px"><button type="button" id="mclose">閉じる</button></div>
</dialog>

<dialog id="dlg">
  <form method="dialog">
    <h3 style="margin-top:0">名前を取り込む</h3>
    <p style="color:var(--mute);font-size:14px">Tonamelの参加者ページを全選択(Ctrl+A)→コピーして、そのまま貼り付けてください。1行に1人ずつの名前リストでも取り込めます。すでにいる人は無視され、読み・支払いは変わりません。新しい人だけ追加されます。</p>
    <textarea id="paste" placeholder="けいらく&#10;ウエティ&#10;isara"></textarea>
    <p id="importMsg" class="err"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button value="cancel">閉じる</button>
      <button type="button" class="primary" id="doImport">取り込む</button>
    </div>
  </form>
</dialog>

<dialog id="sdlg">
  <form method="dialog">
    <h3 style="margin-top:0">アカウント管理</h3>
    <div id="staffList"></div>
    <div class="form">
      <input type="text" id="sName" placeholder="名前">
      <input type="text" id="sPass" placeholder="パスワード" autocomplete="off">
      <select id="sRole">
        <option value="reception">受付</option>
        <option value="attendant">アテンド</option>
        <option value="results">結果入力係</option>
        <option value="admin">運営</option>
      </select>
      <button type="button" class="primary" id="sSave">追加/更新</button>
    </div>
    <p style="color:var(--mute);font-size:13px">同じ名前で保存するとパスワードと役割を更新します(その人はログアウトされます)。</p>
    <p id="sMsg" class="err"></p>
    <div style="text-align:right"><button value="cancel">閉じる</button></div>
  </form>
</dialog>

<script>
const SB_URL = "https://pnosjjeghcfsxxprcdfr.supabase.co";
const SB_KEY = "sb_publishable_dDd-zIg5OFIbj3MKImMWHw_QVupH0Hc";
const $ = s => document.querySelector(s);
const ROLE_LABEL = { admin: "運営", reception: "受付", attendant: "アテンド", results: "結果入力係" };
let token = "", me = null, players = [], bracket = [], brList = [], view = "players", filter = "all", callMode = false, brMode = "chart", brTab = "todo", sortMode = "no";

try { token = localStorage.getItem("reception_token") || ""; } catch (e) {}

async function call(fn, args) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, "Content-Type": "application/json" },
    body: JSON.stringify(args)
  });
  if (!r.ok) {
    let m = ""; try { m = (await r.json()).message || ""; } catch (_) {}
    const err = new Error(m || String(r.status));
    err.kind = m === "not logged in" ? "auth" : m === "forbidden" ? "forbidden" : m === "bad login" ? "login" : "other";
    throw err;
  }
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const rpc = (fn, args = {}) => call(fn, { p_token: token, ...args });

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const canEdit = () => me && (me.role === "admin" || me.role === "reception");
const isAdmin = () => me && me.role === "admin";

function showGate(msg) {
  me = null; token = "";
  try { localStorage.removeItem("reception_token"); } catch (_) {}
  $("#app").hidden = true; $("#gate").hidden = false;
  $("#gateErr").textContent = msg || "";
}

function applyRole() {
  document.querySelectorAll("[data-need]").forEach(el => {
    const n = el.dataset.need;
    el.hidden = !(n === "admin" ? isAdmin() : canEdit());
  });
  $("#who").textContent = `${me.name}(${ROLE_LABEL[me.role]})`;
  callMode = !canEdit() ? true : callMode;
  // 受付以外(アテンド・結果入力係)は対戦表から始める。運営・受付は参加者から
  setView(canEdit() ? "players" : "bracket");
}

async function load() {
  if (!token) return showGate();
  try {
    if (!me) { me = await rpc("rpc_me"); applyRole(); }
    players = await rpc("rpc_list");
    try { bracket = await rpc("rpc_bracket"); } catch (e) { if (e.kind === "auth") throw e; }
    if (isAdmin() && view === "bracket") { try { brList = await rpc("rpc_bracket_list"); } catch (_) {} }
    $("#gate").hidden = true; $("#app").hidden = false;
    if (!document.activeElement || !document.activeElement.closest("#list")) render();
  } catch (e) {
    if (e.kind === "auth") showGate("ログインの有効期限が切れました。もう一度ログインしてください");
    else $("#stat").textContent = "通信エラー: 再試行中";
  }
}

function setView(v) {
  view = v;
  document.body.classList.toggle("v-bracket", v === "bracket");
  $("#tabPlayers").classList.toggle("on", v === "players");
  $("#tabBracket").classList.toggle("on", v === "bracket");
  if (me) render();
}

// ---- 対戦表 ----
function roundOf(mid) { const [t, rest] = [mid[0], mid.slice(1)]; return { t, n: +rest.split("-")[0], i: +rest.split("-")[1] }; }
function roundLabel(mid, maxW, maxL) {
  const { t, n } = roundOf(mid);
  if (t === "W") {
    if (n === maxW) return "グランドファイナル(リセット)";
    if (n === maxW - 1) return "グランドファイナル";
    if (n === maxW - 2) return "勝者決勝";
    if (n === maxW - 3) return "勝者準決勝";
    return `勝者${n}回戦`;
  }
  return n === maxL ? "敗者決勝" : `敗者${n}回戦`;
}
function sideHtml(name, raw, win) {
  if (name == null) {
    const m = raw.match(/^([@~])(.+)$/);
    return `<div class="side mute">${m ? `${esc(m[2])}の${m[1] === "@" ? "勝者" : "敗者"}待ち` : "未定"}</div>`;
  }
  const pl = players.find(p => p.name === name) || {}, y = pl.yomi, no = pl.reg_no ? `登録番号 ${pl.reg_no}` : "";
  const sub = [y ? name : "", no].filter(Boolean).join(" / ");
  return `<div class="side${win ? " win" : ""}"><div class="yomi-big">${esc(y || name)}</div>${sub ? `<div class="name-small">${esc(sub)}</div>` : ""}</div>`;
}
function scoreOf(g) { return [...g].reduce((s, c) => (s[c === "a" ? 0 : 1]++, s), [0, 0]); }
function gamesHtml(r) {
  const g = r.games || "";
  const known = r.a_name != null && r.b_name != null;
  if (!known) return "";
  const [sa, sb] = scoreOf(g);
  const winName = r.winner === "a" ? r.a_name : r.winner === "b" ? r.b_name : null;
  let h = `<div class="games"><div class="mute">${r.first_to}本先取${g ? `　現在 ${sa} - ${sb}` : ""}</div>`;
  [...g].forEach((c, i) => { h += `<div>${i + 1}本目　<b>${esc(c === "a" ? r.a_name : r.b_name)}</b></div>`; });
  if (winName) h += `<div class="winline">${esc(winName)} 選手の勝ち${g ? "" : "(不戦勝・棄権など)"}</div>`;
  if (r.last_by && (g || r.winner)) h += `<div class="mute regby">登録: ${esc(r.last_by)}　${fmtAt(r.last_at)}</div>`;
  return h + `</div>`;
}
function matchHtml(r, maxW, maxL, ready) {
  const win = r.winner, g = r.games || "";
  let btns = "";
  if (canResult()) {
    if (ready) {
      btns = `<div class="wbtns"><button data-mid="${r.mid}" data-act="game-a">${g.length + 1}本目: ${esc(r.a_name)}</button><button data-mid="${r.mid}" data-act="game-b">${g.length + 1}本目: ${esc(r.b_name)}</button></div>
        <div class="subbtns">${g ? `<button class="mini" data-mid="${r.mid}" data-act="undo">直前の1本を取り消す</button><button class="mini" data-mid="${r.mid}" data-act="reset">この試合の記録をすべて消す</button>` : ""}
        <details><summary class="mini">不戦勝・棄権で終了</summary>
        <button class="mini" data-mid="${r.mid}" data-act="wo-a">${esc(r.a_name)} の勝ち</button> <button class="mini" data-mid="${r.mid}" data-act="wo-b">${esc(r.b_name)} の勝ち</button></details></div>`;
    } else if (win) {
      btns = `<div class="subbtns" style="justify-content:flex-end">${g ? `<button class="mini" data-mid="${r.mid}" data-act="undo">直前の1本を取り消す</button>` : ""}<button class="mini" data-mid="${r.mid}" data-act="reset">この試合の結果をすべて消す</button></div>`;
    }
  }
  return `<div class="match${win ? " done" : ""}"><div class="mhead"><b>#${r.mid}</b><span>${roundLabel(r.mid, maxW, maxL)}</span></div>
    <div class="sides">${sideHtml(r.a_name, r.a_raw, win === "a")}<div class="vs">VS</div>${sideHtml(r.b_name, r.b_raw, win === "b")}</div>${gamesHtml(r)}${btns}</div>`;
}
function renderBracket() {
  const list = $("#list"); list.className = "";
  $("#stat").textContent = "";
  if (!bracket.length) { list.innerHTML = `<div class="empty">対戦表がまだありません。運営が取り込むと表示されます。</div>`; return; }
  let maxW = 0, maxL = 0;
  bracket.forEach(r => { const o = roundOf(r.mid); if (o.t === "W") maxW = Math.max(maxW, o.n); else maxL = Math.max(maxL, o.n); });
  const q = $("#search").value.trim().toLowerCase();
  const hit = r => !q || [r.mid, r.a_name, r.b_name, ...[r.a_name, r.b_name].map(n => (players.find(p => p.name === n) || {}).yomi), ...[r.a_name, r.b_name].map(n => (players.find(p => p.name === n) || {}).reg_no)]
    .some(s => s && String(s).toLowerCase().includes(q));
  const key = r => { const o = roundOf(r.mid); return o.n * 1000 + (o.t === "L" ? 500 : 0) + o.i; };
  const ready = bracket.filter(r => r.a_name != null && r.b_name != null && !r.winner && hit(r)).sort((a, b) => key(a) - key(b));
  const done = bracket.filter(r => r.winner && hit(r)).sort((a, b) => key(b) - key(a));
  const waiting = bracket.filter(r => !r.winner && (r.a_name == null || r.b_name == null) && hit(r)).sort((a, b) => key(a) - key(b));
  const name = bracket[0].bracket;
  const bar = brBarHtml(name);
  if (isAdmin() && brMode === "chart") return renderChart(bar, hit);
  let html = bar + `<div class="brbar"><button data-brtab="todo" class="${brTab === "todo" ? "on" : ""}">未登録 (${ready.length + waiting.length})</button><button data-brtab="done" class="${brTab === "done" ? "on" : ""}">登録済み (${done.length})</button></div>`;
  if (brTab === "done") {
    html += done.length ? done.map(r => matchHtml(r, maxW, maxL, false)).join("") : `<div class="empty">登録済みの試合はまだありません</div>`;
  } else {
    html += `<div class="sec">次に行う試合 (${ready.length})</div>`;
    html += ready.length ? ready.map(r => matchHtml(r, maxW, maxL, true)).join("") : `<div class="empty">今すぐ行える試合はありません</div>`;
    if (waiting.length) html += `<details class="waiting"><summary>対戦相手が決まっていない試合 (${waiting.length})</summary>${waiting.map(r => matchHtml(r, maxW, maxL, false)).join("")}</details>`;
  }
  const open = [...list.querySelectorAll("details")].map(d => d.open);
  list.innerHTML = html;
  list.querySelectorAll("details").forEach((d, i) => { if (open[i]) d.open = true; });
}
const canResult = () => me && ["admin", "results", "attendant"].includes(me.role);

function maxRounds() {
  let maxW = 0, maxL = 0;
  bracket.forEach(r => { const o = roundOf(r.mid); if (o.t === "W") maxW = Math.max(maxW, o.n); else maxL = Math.max(maxL, o.n); });
  return { maxW, maxL };
}
function brBarHtml(name) {
  let h = `<div class="brbar"><b>対戦表: ${esc(name)}</b><span class="mute">全${bracket.length}試合 / 終了${bracket.filter(r => r.winner).length}</span>`;
  if (isAdmin() && brList.length) h += `<select id="brSel">${brList.map(b => `<option value="${esc(b.name)}"${b.active ? " selected" : ""}>${esc(b.name)}(${b.matches}試合)</option>`).join("")}</select>`;
  if (isAdmin()) h += `<button class="mini" id="modeChart">${brMode === "chart" ? "一覧表示にする" : "トーナメント表で見る"}</button><button class="mini" id="resetAll" style="color:var(--ng);border-color:var(--ng)">全試合の結果をリセット</button>`;
  return h + `</div>`;
}

// ---- 管理者用: トーナメント表(Tonamel風) ----
let curMid = null;
function openMatch(mid) { curMid = mid; $("#mdlg").showModal(); refreshMatchDialog(); }
// ---- 登録の履歴(誰がいつ登録したか) ----
const logCache = {};
const fmtAt = at => { try { return new Date(at).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (_) { return ""; } };
function logLine(l, r) {
  const nm = s => (s === "a" ? r.a_name : s === "b" ? r.b_name : "");
  let t;
  if (l.action === "add") { const c = l.games.slice(-1); t = `${l.games.length}本目 ${nm(c)}` + (l.winner ? `　→ ${nm(l.winner)} の勝ちで確定` : ""); }
  else if (l.action === "undo") t = "直前の1本を取り消し";
  else if (l.action === "reset") t = "この試合の記録をすべて消去";
  else if (l.action === "clear") t = "結果を取り消し";
  else if (l.action === "walkover") t = `${nm(l.winner)} の不戦勝・棄権で終了`;
  else if (l.action === "cascade") t = "前の試合の結果が変わったため取り消し";
  else if (l.action === "reset-all") t = "全試合の結果をリセット";
  else t = l.action;
  return `<div class="logrow"><span class="mute">${esc(fmtAt(l.at))}</span> <b>${esc(l.staff)}</b> ${esc(t)}</div>`;
}
async function loadMatchLog(mid) {
  try {
    const rows = await rpc("rpc_match_log", { p_mid: mid });
    const r = bracket.find(x => x.mid === mid); if (!r) return;
    logCache[mid] = rows.length ? rows.map(l => logLine(l, r)).join("") : '<div class="mute">まだ登録はありません</div>';
    if (curMid === mid && $("#mlog")) $("#mlog").innerHTML = `<div class="mute">登録の履歴</div>${logCache[mid]}`;
  } catch (_) {}
}
function refreshMatchDialog() {
  if (!curMid || !$("#mdlg").open) return;
  const r = bracket.find(x => x.mid === curMid);
  if (!r) { $("#mdlg").close(); return; }
  const { maxW, maxL } = maxRounds();
  $("#mbody").innerHTML = matchHtml(r, maxW, maxL, r.a_name != null && r.b_name != null && !r.winner)
    + `<div class="mlog" id="mlog"><div class="mute">登録の履歴</div>${logCache[curMid] || '<div class="mute">読み込み中…</div>'}</div>`;
  loadMatchLog(curMid);
}
$("#mdlg").addEventListener("close", () => { curMid = null; });

function renderChart(bar, hit) {
  const list = $("#list");
  const { maxW, maxL } = maxRounds();
  const byId = Object.fromEntries(bracket.map(r => [r.mid, r]));
  const T = mid => mid[0], N = mid => roundOf(mid).n;
  // 同じ側の「勝者が進んでくる」試合(グランドファイナル側は含めない)
  const feeders = r => [r.a_raw, r.b_raw].filter(x => x[0] === "@").map(x => byId[x.slice(1)])
    .filter(f => f && T(f.mid) === T(r.mid) && (T(r.mid) === "L" || N(r.mid) <= maxW - 2));
  const ROW = 60, COL = 200, CW = 178, CH = 52, TOP = 8;
  const Y = {}; let row = 0;
  const lay = mid => {
    if (mid in Y) return Y[mid];
    const f = feeders(byId[mid]);
    if (!f.length) Y[mid] = row++;
    else { const ys = f.map(x => lay(x.mid)); Y[mid] = ys.reduce((s, v) => s + v, 0) / ys.length; }
    return Y[mid];
  };
  const wRoot = `W${maxW - 2}-1`, lRoot = `L${maxL}-1`;
  if (byId[wRoot]) lay(wRoot);
  bracket.filter(r => T(r.mid) === "W" && N(r.mid) <= maxW - 2 && !(r.mid in Y)).forEach(r => lay(r.mid));
  const wRows = row; row = wRows + 1;
  if (byId[lRoot]) lay(lRoot);
  bracket.filter(r => T(r.mid) === "L" && !(r.mid in Y)).forEach(r => lay(r.mid));
  const total = row;
  const P = {};
  bracket.forEach(r => {
    const y = (T(r.mid) === "W" && N(r.mid) > maxW - 2) ? (Y[wRoot] ?? 0) : Y[r.mid];
    P[r.mid] = { x: (N(r.mid) - 1) * COL + 8, y: TOP + y * ROW };
  });
  const waitText = raw => { const m = raw.match(/^([@~])(.+)$/); return m ? `${m[2]}${m[1] === "@" ? "勝者" : "敗者"}` : "未定"; };
  const cell = (name, raw, score, win) => `<div class="cr${win ? " w" : ""}"><span class="cn">${name != null ? esc(name) : `<i>${esc(waitText(raw))}</i>`}</span><span class="cs">${score}</span></div>`;
  const cards = bracket.map(r => {
    const g = r.games || "", [sa, sb] = scoreOf(g);
    const ready = r.a_name != null && r.b_name != null && !r.winner;
    const cls = `cc${r.winner ? " done" : ready ? (g ? " live" : " ready") : ""}${hit(r) ? "" : " dim"}`;
    const sc = (n, who) => g ? n : (r.winner ? (r.winner === who ? "○" : "") : "");
    return `<div class="${cls}" data-open="${r.mid}" style="left:${P[r.mid].x}px;top:${P[r.mid].y}px;width:${CW}px;height:${CH}px">
      <div class="ch">#${r.mid}${r.first_to === 3 ? " ・3本先取" : ""}</div>${cell(r.a_name, r.a_raw, sc(sa, "a"), r.winner === "a")}${cell(r.b_name, r.b_raw, sc(sb, "b"), r.winner === "b")}</div>`;
  }).join("");
  let paths = "";
  bracket.forEach(r => [r.a_raw, r.b_raw].filter(x => x[0] === "@").forEach(x => {
    const f = byId[x.slice(1)]; if (!f) return;
    const x1 = P[f.mid].x + CW, y1 = P[f.mid].y + CH / 2, x2 = P[r.mid].x, y2 = P[r.mid].y + CH / 2, mx = x2 - 14;
    paths += `<path d="M${x1} ${y1} H${mx} V${y2} H${x2}"/>`;
  }));
  const W = Math.max(maxW, maxL) * COL + 20, H = TOP + (total + 1) * ROW;
  // 見出し(1回戦など)は上に固定し、敗者側までスクロールしたら敗者の見出しに切り替える
  const labels = side => { let h = ""; for (let n = 1; n <= (side === "W" ? maxW : maxL); n++) h += `<div class="chd" style="left:${(n - 1) * COL + 8}px;width:${CW}px">${roundLabel(`${side}${n}-1`, maxW, maxL)}</div>`; return h; };
  const lSwitch = TOP + wRows * ROW - 40;
  const old = list.querySelector(".chart-wrap");
  const sl = old ? old.scrollLeft : 0, st = old ? old.scrollTop : 0;
  list.innerHTML = bar + `<div class="chart-wrap"><div class="chbar" style="width:${W}px">${labels("W")}</div><div class="chart" style="width:${W}px;height:${H}px"><svg width="${W}" height="${H}">${paths}</svg>${cards}</div></div>`;
  const nw = list.querySelector(".chart-wrap"), cb = nw.querySelector(".chbar");
  let side = "W";
  const upd = () => {
    const s = nw.scrollTop >= lSwitch ? "L" : "W";
    if (s !== side) { side = s; cb.innerHTML = labels(s); cb.classList.toggle("l", s === "L"); }
  };
  nw.addEventListener("scroll", upd);
  nw.scrollLeft = sl; nw.scrollTop = st; upd();
  refreshMatchDialog();
}

function render() {
  if (view === "bracket") return renderBracket();
  const q = $("#search").value.trim().toLowerCase();
  const rows = players.filter(p => {
    if (filter === "unpaid" && p.paid) return false;
    if (filter === "noyomi" && p.yomi) return false;
    return !q || p.name.toLowerCase().includes(q) || p.yomi.toLowerCase().includes(q) || (p.reg_no || "").toLowerCase().includes(q);
  });
  // 並び順: 番号順(番号なしは最後) / 読み順(読みなしは最後) / 取り込み順
  const numOf = p => (/^\d+$/.test(p.reg_no || "") ? Number(p.reg_no) : Infinity);
  if (sortMode === "no") rows.sort((a, b) => (numOf(a) - numOf(b)) || (a.id - b.id));
  else if (sortMode === "yomi") rows.sort((a, b) => (!a.yomi - !b.yomi) || a.yomi.localeCompare(b.yomi, "ja") || (a.id - b.id));
  const hasPaid = canEdit();
  $("#stat").textContent = `${players.length}人` + (hasPaid ? `　支払い ${players.filter(p => p.paid).length}/${players.length}　読み ${players.filter(p => p.yomi).length}/${players.length}` : "");
  const list = $("#list");
  list.className = callMode ? "call" : "edit";
  if (!rows.length) { list.innerHTML = `<div class="empty">該当する選手がいません</div>`; return; }
  list.innerHTML = rows.map(p => callMode ? `
    <div class="row">
      <div><div class="yomi-big">${esc(p.yomi) || '<span style="color:var(--mute)">(読み未入力)</span>'}</div><div class="name-small">${esc(p.name)}${p.reg_no ? ` / 登録番号 ${esc(p.reg_no)}` : ""}</div></div>
      ${hasPaid ? `<div class="badge ${p.paid ? "y" : "n"}">${p.paid ? "支払済" : "未払い"}</div>` : ""}
    </div>` : `
    <div class="row" data-id="${p.id}">
      <input type="text" class="regno" value="${esc(p.reg_no)}" placeholder="登録番号">
      <div class="name">${esc(p.name)}</div>
      <input type="text" class="yomi" value="${esc(p.yomi)}" placeholder="読み(ふりがな)">
      <button class="paid ${p.paid ? "y" : "n"}">${p.paid ? "支払済" : "未払い"}</button>
      <input type="text" class="note" value="${esc(p.note)}" placeholder="メモ">
      ${isAdmin() ? `<button class="del" title="この選手を削除">削除</button>` : "<span></span>"}
    </div>`).join("");
}

async function save(id, patch) {
  const p = players.find(x => x.id == id);
  Object.assign(p, patch);
  try { await rpc("rpc_update", { p_id: id, p_yomi: p.yomi, p_paid: p.paid, p_note: p.note, p_reg_no: p.reg_no }); }
  catch (e) { $("#stat").textContent = e.kind === "forbidden" ? "この操作の権限がありません" : "保存に失敗しました。再度操作してください"; }
}

$("#list").addEventListener("change", e => {
  const row = e.target.closest(".row"); if (!row || !canEdit()) return;
  const id = row.dataset.id;
  if (e.target.classList.contains("yomi")) save(id, { yomi: e.target.value.trim() });
  if (e.target.classList.contains("note")) save(id, { note: e.target.value.trim() });
  if (e.target.classList.contains("regno")) save(id, { reg_no: e.target.value.trim() });
});
$("#list").addEventListener("change", async e => {
  if (e.target.id !== "brSel") return;
  try { await rpc("rpc_bracket_activate", { p_name: e.target.value }); await load(); } catch (_) { $("#stat").textContent = "切り替えに失敗しました"; }
});
const onClick = async e => {
  const oc = e.target.closest("[data-open]");
  if (oc) { openMatch(oc.dataset.open); return; }
  const bt = e.target.closest("button[data-brtab]");
  if (bt) { brTab = bt.dataset.brtab; render(); return; }
  if (e.target.id === "modeChart") { brMode = brMode === "chart" ? "list" : "chart"; render(); return; }
  if (e.target.id === "mclose") { $("#mdlg").close(); return; }
  if (e.target.id === "resetAll") {
    const n = bracket.filter(r => r.winner || r.games).length;
    if (!n) { alert("リセットする結果はありません。"); return; }
    if (!confirm(`対戦表「${bracket[0].bracket}」の全${n}試合の結果をすべて消します。元に戻せません。よろしいですか？`)) return;
    if (!confirm("本当にリセットしますか？(最終確認)")) return;
    try { await rpc("rpc_bracket_reset"); $("#mdlg").close(); await load(); }
    catch (_) { $("#stat").textContent = "リセットに失敗しました"; }
    return;
  }
  const wb = e.target.closest("button[data-act]");
  if (wb) {
    const act = wb.dataset.act, mid = wb.dataset.mid;
    const r = bracket.find(x => x.mid === mid), g = r.games || "";
    const nm = s => (s === "a" ? r.a_name : r.b_name);
    let fn = "rpc_set_games", args = {};
    if (act.startsWith("game-")) {
      const next = g + act.slice(5), [sa, sb] = scoreOf(next);
      if ((sa === r.first_to || sb === r.first_to) && !confirm(`#${mid}: ${next.split("").map((c, i) => `${i + 1}本目 ${nm(c)}`).join("、")}\n${nm(sa === r.first_to ? "a" : "b")} 選手の勝ちで確定しますか？`)) return;
      args = { p_mid: mid, p_games: next };
    } else if (act === "undo") {
      if (r.winner && !confirm(`#${mid} の直前の1本を取り消しますか？(この先の試合の結果も取り消されます)`)) return;
      args = { p_mid: mid, p_games: g.slice(0, -1) };
    } else if (act === "reset") {
      if (!confirm(`#${mid} の${r.winner ? "結果" : "記録"}をすべて消しますか？${r.winner ? "(この先の試合の結果も取り消されます)" : ""}`)) return;
      args = { p_mid: mid, p_games: "" };
    } else if (act === "clear") {
      if (!confirm(`#${mid} の結果を取り消しますか？(この先の試合の結果も取り消されます)`)) return;
      fn = "rpc_set_result"; args = { p_mid: mid, p_winner: null };
    } else if (act.startsWith("wo-")) {
      if (!confirm(`#${mid}: ${nm(act.slice(3))} 選手の不戦勝・棄権勝ちで確定しますか？(1本ごとの記録は消えます)`)) return;
      fn = "rpc_set_result"; args = { p_mid: mid, p_winner: act.slice(3) };
    }
    wb.disabled = true;
    try { await rpc(fn, args); await load(); }
    catch (err) { $("#stat").textContent = "結果を保存できませんでした"; wb.disabled = false; }
    return;
  }
  const d = e.target.closest("button.del");
  if (d) {
    const id = d.closest(".row").dataset.id, p = players.find(x => x.id == id);
    if (!confirm(`「${p.name}」を削除しますか？(読み・支払い情報も消えます)`)) return;
    try { await rpc("rpc_delete", { p_id: Number(id) }); players = players.filter(x => x.id != id); render(); }
    catch (_) { $("#stat").textContent = "削除に失敗しました"; }
    return;
  }
  const b = e.target.closest("button.paid"); if (!b || !canEdit()) return;
  const id = b.closest(".row").dataset.id;
  const p = players.find(x => x.id == id);
  await save(id, { paid: !p.paid });
  render();
};

// ---- 取り込み ----
function parsePaste(text) {
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const isStatus = l => l.includes("エントリー済み");
  if (!lines.some(isStatus)) return { names: lines, raw: false };
  const isDate = l => /^\d{4}\/\d{1,2}\/\d{1,2}/.test(l);
  const names = [], nos = [];
  lines.forEach((l, i) => {
    if (!isStatus(l)) return;
    const cand = [];
    for (let j = i - 1; j >= 0 && !isDate(lines[j]) && cand.length < 2; j--) {
      if (lines[j] !== "-") cand.unshift(lines[j]);
    }
    if (!cand.length) return;
    names.push(cand[0]); // 直前2行は「エントリー名」「ユーザー名」
    // 直後の数字だけの行が「エントリー順」(= 登録番号)
    let no = "";
    for (let j = i + 1; j <= i + 3 && j < lines.length && !isDate(lines[j]); j++) {
      if (/^\d{1,4}$/.test(lines[j])) { no = lines[j]; break; }
    }
    nos.push(no);
  });
  return { names, nos, raw: true };
}
$("#importBtn").onclick = () => { $("#importMsg").textContent = ""; $("#dlg").showModal(); };
$("#doImport").onclick = async () => {
  const { names, nos, raw } = parsePaste($("#paste").value);
  if (!names.length) return;
  const msg = $("#importMsg");
  try {
    const before = new Set(players.map(p => p.name));
    const withNos = raw && nos.some(Boolean);
    const res = withNos ? await rpc("rpc_import_entries", { p_names: names, p_nos: nos }) : { added: await rpc("rpc_import", { p_names: names }), numbered: 0 };
    const added = [...new Set(names)].filter(x => !before.has(x));
    let text = `${res.added}人を追加しました` + (added.length ? `: ${added.join("、")}` : "(新しい人はいません)");
    if (withNos) text += `\n登録番号を ${res.numbered}人分 更新しました(番号が入っていた ${nos.filter(Boolean).length}人のうち、変わった人だけ)`;
    if (raw) {
      const gone = players.filter(p => !names.includes(p.name)).map(p => p.name);
      if (gone.length) text += `\nTonamelに見当たらない人: ${gone.join("、")}(辞退なら一覧の「削除」で消せます)`;
    }
    msg.style.color = "var(--ok)"; msg.textContent = text;
    $("#paste").value = "";
    load();
  } catch (e) { msg.style.color = "var(--ng)"; msg.textContent = "取り込みに失敗しました"; }
};
